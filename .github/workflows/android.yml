name: PR to Master CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Secret Files from Base64
        run: |
          # 1. 루트 경로 파일 복원
          echo "${{ secrets.LOCAL_PROPERTIES }}" | base64 --decode > local.properties
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" | base64 --decode > keystore.properties
            
          # 2. app/ 디렉토리 파일 복원
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > app/google-services.json
            
          # 3. app/sign/ 디렉토리 (없을 수 있으므로 생성 후 복원)
          mkdir -p app/sign
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/sign/sdbk3.jks

      - name: Verify Files (Optional)
        run: |
          ls -l local.properties
          ls -l keystore.properties
          ls -l app/google-services.json
          ls -l app/sign/sdbk3.jks
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run unit tests
        run: ./gradlew test
        
      - name: Build debug APK
        run: ./gradlew assembleDebug
